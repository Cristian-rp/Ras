<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Cultural - RAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans flex flex-col min-h-screen">

  <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="/" class="bg-emerald-600 font-bold px-3 py-1 rounded text-xl hover:bg-emerald-500 transition">RAS</a>
        <h1 class="text-lg font-semibold tracking-wide hidden md:block">Red Ancestral de Soacha</h1>
      </div>
      <nav class="space-x-4 text-sm font-medium">
        <a href="/" class="hover:text-emerald-300 transition">Inicio</a>
        <a href="/mapa" class="hover:text-emerald-300 transition">Mapa</a>
        <a href="/relatos" class="hover:text-emerald-300 transition">Memoria</a>
        <a href="/catalogo" class="text-emerald-300 font-bold border-b-2 border-emerald-300 pb-1">Catálogo</a>
        <a href="/emprendimiento" class="bg-amber-500 hover:bg-amber-600 text-stone-900 font-bold px-3 py-1 rounded transition">+ Zona Emprendedor</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto py-10 px-4 flex-grow w-full">
    <div class="flex justify-between items-center mb-6 border-b-2 border-emerald-600 pb-2">
      <h2 class="text-2xl font-bold text-emerald-900">3. Catálogo Cultural y Artesanal</h2>
      <a href="/emprendimiento" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs md:text-sm px-4 py-2 rounded shadow transition">
        ¿Eres artesano? Publica tu producto
      </a>
    </div>
    
    <div id="contenedor-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <footer class="bg-stone-800 text-stone-300 py-4 text-center text-xs">
    <p>&copy; Red Ancestral de Soacha (RAS).</p>
  </footer>

  <script src="/js/catalogo.js"></script>
</body>
</html>
