<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zona Emprendedor - RAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-stone-50 text-stone-800 font-sans flex flex-col min-h-screen">

  <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="/" class="bg-emerald-600 font-bold px-3 py-1 rounded text-xl hover:bg-emerald-500 transition">RAS</a>
        <h1 class="text-lg font-semibold tracking-wide hidden md:block">Red Ancestral de Soacha</h1>
      </div>
      <nav class="space-x-4 text-sm font-medium">
        <a href="/" class="hover:text-emerald-300 transition">Inicio</a>
        <a href="/mapa" class="hover:text-emerald-300 transition">Mapa</a>
        <a href="/relatos" class="hover:text-emerald-300 transition">Memoria</a>
        <a href="/catalogo" class="hover:text-emerald-300 transition">Catálogo</a>
        <a href="/emprendimiento" class="text-amber-300 font-bold border-b-2 border-amber-300 pb-1">+ Zona Emprendedor</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto py-10 px-4 flex-grow w-full">
    <div class="bg-white p-8 rounded-lg shadow-md border border-stone-200">
      <h2 class="text-2xl font-bold text-emerald-900 mb-2">Publicar Producto o Taller Cultural</h2>
      <p class="text-sm text-stone-600 mb-6">
        Sube tus productos, artesanías o talleres para que la comunidad de Soacha y visitantes puedan contactarte directamente por WhatsApp.
      </p>

      <form id="form-producto" class="space-y-4">
        <div>
          <label class="block text-xs font-bold mb-1" for="prod-titulo">Nombre del Producto o Taller *</label>
          <input type="text" id="prod-titulo" placeholder="Ej: Vasija Ceremonial Muysca" required class="w-full border rounded p-2 text-sm focus:outline-emerald-600">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold mb-1" for="prod-artesano">Nombre del Artesano / Emprendimiento *</label>
            <input type="text" id="prod-artesano" placeholder="Ej: Taller Ancestral Sua" required class="w-full border rounded p-2 text-sm focus:outline-emerald-600">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1" for="prod-categoria">Categoría *</label>
            <select id="prod-categoria" required class="w-full border rounded p-2 text-sm focus:outline-emerald-600">
              <option value="Artesanía">Artesanía / Cerámica</option>
              <option value="Textil">Textil / Tejido</option>
              <option value="Gastronomía">Gastronomía Tradicional</option>
              <option value="Taller">Taller / Guianza Cultural</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold mb-1" for="prod-precio">Precio / Valor (COP) *</label>
            <input type="text" id="prod-precio" placeholder="Ej: 35.000 COP" required class="w-full border rounded p-2 text-sm focus:outline-emerald-600">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1" for="prod-contacto">Número de WhatsApp (con código de país) *</label>
            <input type="text" id="prod-contacto" placeholder="Ej: 573100000000" required class="w-full border rounded p-2 text-sm focus:outline-emerald-600">
          </div>
        </div>

        <div class="pt-4 flex justify-end space-x-3">
          <a href="/catalogo" class="px-5 py-2.5 bg-stone-200 text-stone-700 text-sm font-bold rounded hover:bg-stone-300 transition">Cancelar</a>
          <button type="submit" class="px-5 py-2.5 bg-emerald-700 text-white text-sm font-bold rounded hover:bg-emerald-800 transition">
            Publicar en el Catálogo
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer class="bg-stone-800 text-stone-300 py-4 text-center text-xs">
    <p>&copy; Red Ancestral de Soacha (RAS).</p>
  </footer>

  <script src="/js/emprendimiento.js"></script>
</body>
</html>
