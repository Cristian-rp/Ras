<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar / Registro - Red Ancestral de Soacha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-stone-50 text-stone-800 font-sans flex flex-col min-h-screen">

  <!-- Header / Menú de Navegación -->
  <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="/" class="bg-emerald-600 font-bold px-3 py-1 rounded text-xl hover:bg-emerald-500 transition">RAS</a>
        <h1 class="text-lg font-semibold tracking-wide hidden md:block">Red Ancestral de Soacha</h1>
      </div>
      <nav class="flex items-center space-x-4 text-sm font-medium">
        <a href="/" class="hover:text-emerald-300 transition">Inicio</a>
        <a href="/mapa" class="hover:text-emerald-300 transition">Mapa</a>
        <a href="/relatos" class="hover:text-emerald-300 transition">Memoria</a>
        <a href="/catalogo" class="hover:text-emerald-300 transition">Catálogo</a>
        <a href="/emprendimiento" class="bg-amber-500 hover:bg-amber-600 text-stone-900 font-bold px-3 py-1 rounded transition">+ Zona Emprendedor</a>
        <a href="/login" class="text-emerald-300 font-bold border-b-2 border-emerald-300 pb-1">
          Ingresar
        </a>
      </nav>
    </div>
  </header>

  <!-- Módulo de Autenticación -->
  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="bg-white p-8 rounded-lg shadow-md border border-stone-200 max-w-md w-full">
      
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-emerald-900">Acceso a la Plataforma</h2>
        <p class="text-stone-600 text-sm mt-1">Ingresa con tu cuenta de la Red Ancestral de Soacha</p>
      </div>

      <form id="form-login" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-stone-700 mb-1">Correo Electrónico</label>
          <input type="email" id="email" name="email" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="correo@ejemplo.com">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-stone-700 mb-1">Contraseña</label>
          <input type="password" id="password" name="password" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="••••••••">
        </div>

        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 px-4 rounded-md shadow transition">
          Iniciar Sesión
        </button>
      </form>

      <div id="mensaje-respuesta" class="mt-4 text-center text-sm font-medium hidden"></div>

      <div class="mt-6 pt-4 border-t border-stone-200 text-center text-sm text-stone-600">
        ¿Aún no tienes una cuenta registrada? 
        <a href="/emprendimiento" class="text-emerald-700 font-bold hover:underline">
          Registrarme aquí
        </a>
      </div>
    </div>
  </main>

  <footer class="bg-stone-800 text-stone-300 py-6 text-center text-xs">
    <p>&copy; Red Ancestral de Soacha (RAS).</p>
  </footer>

  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msgDiv = document.getElementById('mensaje-respuesta');

      try {
        const respuesta = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await respuesta.json();

        if (respuesta.ok) {
          localStorage.setItem('usuario_ras', JSON.stringify(data.usuario));
          msgDiv.className = 'mt-4 text-center text-sm font-medium text-emerald-700 bg-emerald-50 p-2 rounded';
          msgDiv.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
          msgDiv.classList.remove('hidden');
          
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } else {
          msgDiv.className = 'mt-4 text-center text-sm font-medium text-red-600 bg-red-50 p-2 rounded';
          msgDiv.textContent = data.error || 'Error al iniciar sesión';
          msgDiv.classList.remove('hidden');
        }
      } catch (err) {
        msgDiv.className = 'mt-4 text-center text-sm font-medium text-red-600 bg-red-50 p-2 rounded';
        msgDiv.textContent = 'Error al conectar con el servidor';
        msgDiv.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
