<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Red Ancestral de Soacha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-stone-50 text-stone-800 font-sans flex flex-col min-h-screen">

  <!-- HEADER SIN EL BOTÓN DE ZONA EMPRENDEDOR -->
  <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="/inicio" class="bg-emerald-600 font-bold px-3 py-1 rounded text-xl text-white">RAS</a>
        <h1 class="text-lg font-semibold tracking-wide hidden md:block">Red Ancestral de Soacha</h1>
      </div>
      
      <nav class="flex items-center space-x-4 text-sm font-medium">
        <a href="/inicio" class="hover:text-emerald-300">Inicio</a>
        <a href="/mapa" class="hover:text-emerald-300">Mapa</a>
        <a href="/relatos" class="hover:text-emerald-300">Relatos</a>
        <a href="/catalogo" class="hover:text-emerald-300">Catálogo</a>
        <a href="/perfil" class="hover:text-emerald-300">Mi Perfil</a>
        
        <button id="btn-logout" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded transition">
          Cerrar Sesión
        </button>
      </nav>
    </div>
  </header>

  <!-- Módulo de Autenticación -->
  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="bg-white p-8 rounded-lg shadow-md border border-stone-200 max-w-md w-full">
      
      <!-- FORMULARIO 1: LOGIN -->
      <div id="box-login">
        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold text-emerald-900">Iniciar Sesión</h2>
          <p class="text-stone-600 text-sm mt-1">Ingresa credenciales para acceder a la plataforma</p>
        </div>

        <form id="form-login" class="space-y-4">
          <div>
            <label for="login-email" class="block text-sm font-medium text-stone-700 mb-1">Correo Electrónico</label>
            <input type="email" id="login-email" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="correo@ejemplo.com">
          </div>

          <div>
            <label for="login-password" class="block text-sm font-medium text-stone-700 mb-1">Contraseña</label>
            <input type="password" id="login-password" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="••••••••">
          </div>

          <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 px-4 rounded-md shadow transition">
            Ingresar a la Plataforma
          </button>
        </form>

        <div class="mt-6 pt-4 border-t border-stone-200 text-center text-sm text-stone-600">
          ¿Aún no tienes cuenta? 
          <button id="btn-ver-registro" class="text-emerald-700 font-bold hover:underline">
            Regístrate aquí
          </button>
        </div>
      </div>

      <!-- FORMULARIO 2: REGISTRO DE USUARIO -->
      <div id="box-registro" class="hidden">
        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold text-emerald-900">Crear Cuenta</h2>
          <p class="text-stone-600 text-sm mt-1">Regístrate para participar en la plataforma</p>
        </div>

        <form id="form-registro" class="space-y-4">
          <div>
            <label for="reg-nombre" class="block text-sm font-medium text-stone-700 mb-1">Nombre Completo</label>
            <input type="text" id="reg-nombre" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="Tu nombre">
          </div>

          <div>
            <label for="reg-email" class="block text-sm font-medium text-stone-700 mb-1">Correo Electrónico</label>
            <input type="email" id="reg-email" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="correo@ejemplo.com">
          </div>

          <div>
            <label for="reg-password" class="block text-sm font-medium text-stone-700 mb-1">Contraseña</label>
            <input type="password" id="reg-password" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="••••••••">
          </div>

          <div>
            <label for="reg-rol" class="block text-sm font-medium text-stone-700 mb-1">Tipo de Usuario</label>
            <select id="reg-rol" class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-white">
              <option value="usuario">Usuario General (Comentarios y Memoria)</option>
              <option value="emprendedor">Emprendedor / Artesano (Publicación en Catálogo)</option>
            </select>
          </div>

          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-stone-900 font-bold py-2 px-4 rounded-md shadow transition">
            Completar Registro
          </button>
        </form>

        <div class="mt-6 pt-4 border-t border-stone-200 text-center text-sm text-stone-600">
          ¿Ya tienes cuenta? 
          <button id="btn-ver-login" class="text-emerald-700 font-bold hover:underline">
            Inicia sesión aquí
          </button>
        </div>
      </div>

      <div id="msg-alerta" class="mt-4 text-center text-sm font-medium hidden"></div>

    </div>
  </main>

  <footer class="bg-stone-800 text-stone-300 py-6 text-center text-xs">
    <p>&copy; Red Ancestral de Soacha (RAS).</p>
  </footer>

  <script>
    // 1. Comprobación automática de sesión iniciada
    document.addEventListener('DOMContentLoaded', () => {
      const usuarioGuardado = localStorage.getItem('usuarioRAS');
      if (usuarioGuardado) {
        // Si ya inició sesión, redirigir directamente al inicio
        window.location.href = '/inicio';
      }
    });

    const boxLogin = document.getElementById('box-login');
    const boxRegistro = document.getElementById('box-registro');
    const btnVerRegistro = document.getElementById('btn-ver-registro');
    const btnVerLogin = document.getElementById('btn-ver-login');
    const msgAlerta = document.getElementById('msg-alerta');

    // Alternar entre login y registro
    btnVerRegistro.addEventListener('click', () => {
      boxLogin.classList.add('hidden');
      boxRegistro.classList.remove('hidden');
      msgAlerta.classList.add('hidden');
    });

    btnVerLogin.addEventListener('click', () => {
      boxRegistro.classList.add('hidden');
      boxLogin.classList.remove('hidden');
      msgAlerta.classList.add('hidden');
    });

    // Petición Login
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          // Guardar sesión del usuario en localStorage
          localStorage.setItem('usuarioRAS', JSON.stringify(data.usuario));
          msgAlerta.className = 'mt-4 text-center text-sm font-medium text-emerald-700 bg-emerald-50 p-2 rounded';
          msgAlerta.textContent = '¡Credenciales correctas! Ingresando a la plataforma...';
          msgAlerta.classList.remove('hidden');

          // Redirección directa a la vista de inicio (/inicio)
          setTimeout(() => { window.location.href = '/inicio'; }, 1000);
        } else {
          msgAlerta.className = 'mt-4 text-center text-sm font-medium text-red-600 bg-red-50 p-2 rounded';
          msgAlerta.textContent = data.error || 'Credenciales incorrectas';
          msgAlerta.classList.remove('hidden');
        }
      } catch (err) {
        msgAlerta.className = 'mt-4 text-center text-sm font-medium text-red-600 bg-red-50 p-2 rounded';
        msgAlerta.textContent = 'Error de conexión con el servidor';
        msgAlerta.classList.remove('hidden');
      }
    });

    // Petición Registro
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('reg-nombre').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const rol = document.getElementById('reg-rol').value;

      try {
        const res = await fetch('/api/auth/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password, rol })
        });
        const data = await res.json();

        if (res.ok) {
          msgAlerta.className = 'mt-4 text-center text-sm font-medium text-emerald-700 bg-emerald-50 p-2 rounded';
          msgAlerta.textContent = '¡Registro exitoso! Ya puedes iniciar sesión.';
          msgAlerta.classList.remove('hidden');

          setTimeout(() => {
            boxRegistro.classList.add('hidden');
            boxLogin.classList.remove('hidden');
            msgAlerta.classList.add('hidden');
          }, 1500);
        } else {
          msgAlerta.className = 'mt-4 text-center text-sm font-medium text-red-600 bg-red-50 p-2 rounded';
          msgAlerta.textContent = data.error || 'Error al registrar';
          msgAlerta.classList.remove('hidden');
        }
      } catch (err) {
        msgAlerta.className = 'mt-4 text-center text-sm font-medium text-red-600 bg-red-50 p-2 rounded';
        msgAlerta.textContent = 'Error de conexión con el servidor';
        msgAlerta.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
