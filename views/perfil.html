<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Red Ancestral de Soacha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-stone-50 text-stone-800 font-sans flex flex-col min-h-screen">

  <!-- Header Estandarizado -->
  <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="/inicio" class="bg-emerald-600 font-bold px-3 py-1 rounded text-xl text-white">RAS</a>
        <h1 class="text-lg font-semibold tracking-wide hidden md:block">Red Ancestral de Soacha</h1>
      </div>
      <nav class="flex items-center space-x-4 text-sm font-medium">
        <a href="/inicio" class="hover:text-emerald-300">Inicio</a>
        <a href="/mapa" class="hover:text-emerald-300">Mapa</a>
        <a href="/relatos" class="hover:text-emerald-300">Relatos</a>
        <a href="/catalogo" class="hover:text-emerald-300">Catálogo</a>
        <a href="/emprendimiento" id="nav-emprendimiento" class="bg-amber-500 hover:bg-amber-600 text-stone-900 px-3 py-1 rounded font-bold hidden transition">+ Zona Emprendedor</a>
        <a href="/perfil" class="hover:text-emerald-300 font-bold text-amber-400">Mi Perfil</a>
        <button id="btn-logout" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded transition">Cerrar Sesión</button>
      </nav>
    </div>
  </header>

  <!-- Módulo de Perfil del Usuario -->
  <main class="flex-grow max-w-5xl mx-auto px-4 py-10 w-full">
    <div class="bg-white p-6 rounded-lg shadow-md border border-stone-200 mb-8">
      <h2 class="text-2xl font-bold text-emerald-900 mb-2" id="perfil-nombre">Cargando perfil...</h2>
      <p class="text-stone-600 text-sm mb-1"><strong>Correo:</strong> <span id="perfil-email">...</span></p>
      <p class="text-stone-600 text-sm"><strong>Rol:</strong> <span id="perfil-rol" class="capitalize font-semibold text-emerald-800">...</span></p>
    </div>

    <!-- Publicaciones y Contenidos del Usuario -->
    <div class="space-y-6">
      <h3 class="text-xl font-bold text-emerald-900 border-b-2 border-emerald-600 pb-2">Mis Publicaciones</h3>
      <div id="contenedor-publicaciones" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-stone-500 text-sm">Cargando publicaciones...</p>
      </div>
    </div>
  </main>

  <footer class="bg-stone-800 text-stone-300 py-6 text-center text-xs">
    <p>&copy; Red Ancestral de Soacha (RAS).</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const usuarioSesion = localStorage.getItem('usuarioRAS');
      if (!usuarioSesion) {
        window.location.href = '/login';
        return;
      }

      const usuario = JSON.parse(usuarioSesion);

      // Configuración de Menú según rol
      const navEmprendimiento = document.getElementById('nav-emprendimiento');
      if (usuario.rol === 'emprendedor') {
        navEmprendimiento.classList.remove('hidden');
      }

      document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('usuarioRAS');
        window.location.href = '/login';
      });

      // Cargar Datos del Perfil
      document.getElementById('perfil-nombre').textContent = usuario.nombre;
      document.getElementById('perfil-email').textContent = usuario.email;
      document.getElementById('perfil-rol').textContent = usuario.rol;

      // Obtener publicaciones del usuario desde la API
      try {
        const res = await fetch(`/api/usuario/${usuario.id}/publicaciones`);
        const data = await res.json();

        const contenedor = document.getElementById('contenedor-publicaciones');
        contenedor.innerHTML = '';

        if (data.relatos.length === 0 && data.productos.length === 0) {
          contenedor.innerHTML = '<p class="text-stone-500 text-sm col-span-2">Aún no has realizado ninguna publicación.</p>';
          return;
        }

        // Renderizar Relatos
        data.relatos.forEach(relato => {
          contenedor.innerHTML += `
            <div class="bg-white p-4 rounded shadow border border-stone-200">
              <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">Relato</span>
              <h4 class="font-bold text-lg mt-1">${relato.titulo}</h4>
              <p class="text-sm text-stone-600 mt-2">${relato.contenido}</p>
            </div>
          `;
        });

        // Renderizar Productos
        data.productos.forEach(prod => {
          contenedor.innerHTML += `
            <div class="bg-white p-4 rounded shadow border border-stone-200">
              <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">Producto</span>
              <h4 class="font-bold text-lg mt-1">${prod.titulo}</h4>
              <p class="text-sm text-stone-600 font-bold">$ ${prod.precio} COP</p>
            </div>
          `;
        });
      } catch (err) {
        console.error('Error al cargar publicaciones:', err);
      }
    });
  </script>
</body>
</html>
