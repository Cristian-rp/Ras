<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoria Viva y Relatos - RAS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Estilos propios -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-stone-50 text-stone-800 font-sans flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="/" class="bg-emerald-600 font-bold px-3 py-1 rounded text-xl hover:bg-emerald-500 transition">RAS</a>
        <h1 class="text-lg font-semibold tracking-wide hidden md:block">Red Ancestral de Soacha</h1>
      </div>
      <nav class="space-x-4 text-sm font-medium">
        <a href="/" class="hover:text-emerald-300 transition">Inicio</a>
        <a href="/mapa" class="hover:text-emerald-300 transition">Mapa</a>
        <a href="/relatos" class="text-emerald-300 font-bold border-b-2 border-emerald-300 pb-1">Memoria</a>
        <a href="/catalogo" class="hover:text-emerald-300 transition">Catálogo</a>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="bg-stone-100 py-10 px-4 flex-grow w-full">
    <div class="max-w-7xl mx-auto">
      <div class="flex justify-between items-center mb-6 border-b-2 border-emerald-600 pb-2">
        <h2 class="text-2xl font-bold text-emerald-900">2. Memoria Viva y Relatos</h2>
        <button id="btn-abrir-modal" class="bg-emerald-700 hover:bg-emerald-800 text-white text-sm px-4 py-2 rounded shadow transition">
          + Compartir un Relato
        </button>
      </div>
      
      <!-- Contenedor Dinámico de Relatos -->
      <div id="contenedor-relatos" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>
  </main>

  <!-- Modal para Agregar Relato -->
  <div id="modal-relato" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg p-6 max-w-lg w-full shadow-xl">
      <h3 class="text-xl font-bold text-emerald-900 mb-4">Compartir un Relato o Historia</h3>
      <form id="form-relato">
        <div class="mb-3">
          <label class="block text-xs font-bold mb-1" for="relato-titulo">Título del Relato</label>
          <input type="text" id="relato-titulo" required class="w-full border rounded p-2 text-sm">
        </div>
        <div class="mb-3">
          <label class="block text-xs font-bold mb-1" for="relato-autor">Publicado por (Nombre o Colectivo)</label>
          <input type="text" id="relato-autor" required class="w-full border rounded p-2 text-sm">
        </div>
        <div class="mb-4">
          <label class="block text-xs font-bold mb-1" for="relato-contenido">Historia o Testimonio</label>
          <textarea id="relato-contenido" rows="4" required class="w-full border rounded p-2 text-sm"></textarea>
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" id="btn-cerrar-modal" class="px-4 py-2 bg-stone-300 rounded text-sm font-bold">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-emerald-700 text-white rounded text-sm font-bold hover:bg-emerald-800">Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-stone-800 text-stone-300 py-4 text-center text-xs">
    <p>&copy; Red Ancestral de Soacha (RAS).</p>
  </footer>

  <!-- Script específico para esta pantalla -->
  <script src="/js/relatos.js"></script>
</body>
</html>
